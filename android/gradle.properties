# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: reuse the configured task graph across invocations. build.gradle.kts reads
# its -P / env / git inputs through configuration-cache-tracked APIs, so a changed versionCode,
# signing env or HEAD invalidates the cache entry instead of being served stale.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes for smaller, faster builds
android.nonTransitiveRClass=true

# R8 full mode and optimized resource shrinking are AGP 9 defaults. Never add
# android.enableR8.fullMode=false or android.r8.optimizedResourceShrinking=false here.

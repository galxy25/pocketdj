name: PocketDJ
options:
  bundleIdPrefix: com.levi
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.20"
  # Spotify iOS SDK — OPT-IN. The provider compiles fine WITHOUT it (the `#else`
  # stub in SpotifyProvider.swift). To enable Spotify streaming: uncomment the
  # package below AND the matching dependency under targets.PocketDJ, then run
  # `xcodegen generate`. The repo vends an SPM package whose product/module is
  # `SpotifyiOS` — the exact name SpotifyProvider.swift gates on with
  # `#if canImport(SpotifyiOS)`. (Alternatively, drag the prebuilt
  # SpotifyiOS.xcframework from github.com/spotify/ios-sdk/releases into the
  # target's "Frameworks" instead of using SPM.)
  #
  # SpotifyiOS:
  #   url: https://github.com/spotify/ios-sdk.git
  #   from: "3.0.0"
  #
  # youtube-ios-player-helper — OPT-IN (embedded YouTube playback). The YouTube
  # provider's SEARCH (Data API v3, API key) works WITHOUT this; only embedded
  # playback needs it. The view compiles without it via the `#else` placeholder
  # in YouTubePlayerView.swift. To enable playback: uncomment the package below
  # AND the matching dependency under targets.PocketDJ, then `xcodegen generate`.
  # The SPM product/module is `YouTubeiOSPlayerHelper` — the exact name
  # YouTubePlayerView.swift gates on with `#if canImport(YouTubeiOSPlayerHelper)`.
  # (iOS only — the package is a UIKit `YTPlayerView`/WKWebView wrapper.)
  #
  # YouTubeiOSPlayerHelper:
  #   url: https://github.com/youtube/youtube-ios-player-helper.git
  #   from: "1.0.4"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Automatic signing with Levi Schoen's developer team (also enables on-device
    # testing). Build/test with `-allowProvisioningUpdates` so Xcode can mint the
    # development cert + provisioning profiles on first run.
    DEVELOPMENT_TEAM: EC27UF79GL
    CODE_SIGN_STYLE: Automatic

targets:
  PocketDJ:
    type: application
    # Single multiplatform target — one app that runs on iPhone, iPad, and Mac.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PocketDJ
    # A base Info.plist supplies the one key Xcode's INFOPLIST_KEY_* generation can't
    # express: UIBackgroundModes (an array). Xcode still LAYERS its generated keys +
    # the INFOPLIST_KEY_* settings below on top of this file, so we only declare the
    # background-audio mode here and leave everything else to generation.
    info:
      path: PocketDJ/Generated/Info.plist
      properties:
        # `audio` keeps playback alive; `fetch`+`processing` let the BGAppRefreshTask /
        # BGProcessingTask run (rip-reconcile + burn-drain). iOS-only keys — macOS ignores
        # them harmlessly.
        UIBackgroundModes: [audio, fetch, processing]
        # Every BGTask id submitted must be declared here or register/submit throws.
        BGTaskSchedulerPermittedIdentifiers:
          - com.levi.pocketdj.burn-drain
          - com.levi.pocketdj.rip-reconcile
        # Apple Music opt-in flag (read by AppleMusicCredentials.isEnabled). MUST live
        # in this base plist: INFOPLIST_KEY_* only injects Apple's KNOWN keys, not custom
        # ones, so the build-setting form silently no-ops (the "Apple Music not available"
        # bug). A boolean here lands in the built Info.plist.
        PocketDJAppleMusicEnabled: true
        # Export-compliance exemption. PocketDJ uses only standard/exempt encryption
        # (HTTPS/TLS), so `false` tells App Store Connect there's no non-exempt
        # encryption — TestFlight then STOPS asking the per-build "export compliance"
        # question on every upload. Lands in the built Info.plist (same reason as the
        # keys above), so apple/scripts/testflight.sh uploads are submit-ready immediately.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: ZIPFoundation
      # Uncomment to link the Spotify SDK (see packages.SpotifyiOS above):
      # - package: SpotifyiOS
      # Uncomment to link the YouTube player helper (see the package above):
      # - package: YouTubeiOSPlayerHelper
    # --- Spotify streaming Info.plist (OPT-IN) -------------------------------
    # The default build keeps GENERATE_INFOPLIST_FILE (no explicit plist). To
    # enable Spotify, supply the URL scheme + query scheme + credentials. Because
    # CFBundleURLTypes / LSApplicationQueriesSchemes are arrays (not expressible
    # as scalar INFOPLIST_KEY_* settings), uncomment the `info:` block below AND
    # comment out `GENERATE_INFOPLIST_FILE` in settings.base, then migrate the
    # INFOPLIST_KEY_* values into the properties (XcodeGen fills the rest). See
    # PocketDJ/Services/Streaming/SPOTIFY_SETUP.md for the full, ready-to-paste
    # plist and the exact dashboard steps.
    #
    # info:
    #   path: PocketDJ/Info.plist
    #   properties:
    #     CFBundleURLTypes:
    #       - CFBundleURLName: com.levi.pocketdj.spotify
    #         CFBundleURLSchemes: [pocketdj]
    #       # YouTube OAuth redirect — the REVERSED client id is the scheme. Replace
    #       # 1234-abcd with your iOS OAuth client id's prefix (everything before
    #       # ".apps.googleusercontent.com"). Must match YouTubeOAuthClientID below.
    #       - CFBundleURLName: com.levi.pocketdj.youtube
    #         CFBundleURLSchemes: [com.googleusercontent.apps.1234-abcd]
    #     LSApplicationQueriesSchemes: [spotify]
    #     SpotifyClientID: ""                                  # your dashboard client id
    #     SpotifyRedirectURL: pocketdj://spotify-login-callback
    #     # --- YouTube (Google Cloud) ---
    #     YouTubeAPIKey: ""                                    # Data API v3 key (search)
    #     YouTubeOAuthClientID: ""                             # iOS OAuth client (account-link)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levi.pocketdj
        PRODUCT_NAME: PocketDJ
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: PocketDJ
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: "PocketDJ"
        # --- Streaming + recognition permissions (Info.plist usage strings) ----
        # Scalar usage descriptions are injectable as INFOPLIST_KEY_* without
        # switching off GENERATE_INFOPLIST_FILE. These are PROMPT strings only;
        # the prompts never fire unless the matching feature is enabled at
        # runtime (ShazamKit mic capture / MusicKit authorization), so shipping
        # them in the default build is harmless.
        #   • Microphone — the "?♪?" ShazamKit recognizer's audio capture.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PocketDJ listens to identify the song that's playing."
        #   • Apple Music — MusicKit catalog search + playback when linked.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "PocketDJ uses Apple Music to play and search tracks from your subscription."
        # --- MusicKit + ShazamKit entitlements ---------------------------------
        # Both app-service entitlements live in one .entitlements file. They are
        # only ENFORCED when signing for a device/distribution (the App ID must
        # have the matching App Services enabled in the Developer portal first —
        # see docs/streaming-integration.md). Simulator builds (CODE_SIGNING_
        # ALLOWED=NO) ignore them, so the default build stays green.
        CODE_SIGN_ENTITLEMENTS: PocketDJ/PocketDJ.entitlements
        # --- Apple Music build-time opt-in -------------------------------------
        # The flag lives in the base Info.plist (info: properties above) as
        # PocketDJAppleMusicEnabled — INFOPLIST_KEY_* can't inject custom keys.
        # --- Spotify / YouTube OAuth redirect (CFBundleURLTypes) placeholder ----
        # CFBundleURLTypes / LSApplicationQueriesSchemes are ARRAYS, not scalar
        # INFOPLIST_KEY_* values, so they can't be injected here. To register the
        # redirect schemes, supply an explicit Info.plist: comment out
        # GENERATE_INFOPLIST_FILE above, uncomment the `info:` block below, and
        # follow docs/streaming-integration.md. Ready-to-paste placeholder:
        #   CFBundleURLTypes:
        #     - CFBundleURLName: com.levi.pocketdj.spotify
        #       CFBundleURLSchemes: [pocketdj]          # pocketdj://spotify-login-callback
        #     - CFBundleURLName: com.levi.pocketdj.youtube
        #       CFBundleURLSchemes: [com.googleusercontent.apps.REVERSED-CLIENT-ID]
        #   LSApplicationQueriesSchemes: [spotify]

  PocketDJTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/Unit
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: PocketDJ
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levi.pocketdj.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # macOS keeps the executable under Contents/MacOS; XcodeGen's default
        # TEST_HOST is the iOS-shaped path, so override it per-SDK.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/PocketDJ.app/Contents/MacOS/PocketDJ"

  PocketDJUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/UI
    dependencies:
      - target: PocketDJ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levi.pocketdj.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PocketDJ:
    build:
      targets:
        PocketDJ: all
        PocketDJTests: [test]
        PocketDJUITests: [test]
    test:
      gatherCoverageData: true
      # Host app + unit tests run against the bundled fixture (offline, deterministic).
      environmentVariables:
        - variable: PDJ_USE_FIXTURE
          value: "1"
          isEnabled: true
      targets:
        - PocketDJTests
        - PocketDJUITests

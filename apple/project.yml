name: PocketDJ
options:
  bundleIdPrefix: com.levi
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    visionOS: "2.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.20"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Automatic signing with Levi Schoen's developer team (also enables on-device
    # testing). Build/test with `-allowProvisioningUpdates` so Xcode can mint the
    # development cert + provisioning profiles on first run.
    DEVELOPMENT_TEAM: EC27UF79GL
    CODE_SIGN_STYLE: Automatic

targets:
  PocketDJ:
    type: application
    # Single multiplatform target — one app that runs on iPhone, iPad, Mac, and Vision Pro.
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: PocketDJ
      # Shared with the widget extension: the NowPlayingSnapshot model + App Group store +
      # the widget transport intents. Compiled into BOTH targets (no shared framework).
      - path: Shared
    # A base Info.plist supplies the one key Xcode's INFOPLIST_KEY_* generation can't
    # express: UIBackgroundModes (an array). Xcode still LAYERS its generated keys +
    # the INFOPLIST_KEY_* settings below on top of this file, so we only declare the
    # background-audio mode here and leave everything else to generation.
    info:
      path: PocketDJ/Generated/Info.plist
      properties:
        # `audio` keeps playback alive; `fetch`+`processing` let the BGAppRefreshTask /
        # BGProcessingTask run (rip-reconcile + burn-drain). iOS-only keys — macOS ignores
        # them harmlessly.
        UIBackgroundModes: [audio, fetch, processing]
        # Every BGTask id submitted must be declared here or register/submit throws.
        BGTaskSchedulerPermittedIdentifiers:
          - com.levi.pocketdj.burn-drain
          - com.levi.pocketdj.rip-reconcile
          - com.levi.pocketdj.storage-prune
        # Apple Music opt-in flag (read by AppleMusicCredentials.isEnabled). MUST live
        # in this base plist: INFOPLIST_KEY_* only injects Apple's KNOWN keys, not custom
        # ones, so the build-setting form silently no-ops (the "Apple Music not available"
        # bug). A boolean here lands in the built Info.plist.
        PocketDJAppleMusicEnabled: true
        # Export-compliance exemption. PocketDJ uses only standard/exempt encryption
        # (HTTPS/TLS), so `false` tells App Store Connect there's no non-exempt
        # encryption — TestFlight then STOPS asking the per-build "export compliance"
        # question on every upload. Lands in the built Info.plist (same reason as the
        # keys above), so apple/scripts/testflight.sh uploads are submit-ready immediately.
        ITSAppUsesNonExemptEncryption: false
        # --- CarPlay scene ---------------------------------------------------------
        # An EXPLICIT scene manifest that declares ONLY the CarPlay scene role + its
        # delegate. `UIApplicationSupportsMultipleScenes: true` lets SwiftUI keep
        # synthesizing the phone's window scene automatically (we deliberately do NOT
        # list UIWindowSceneSessionRoleApplication — the SwiftUI `App`/`WindowGroup`
        # provides it), while the head unit connects `CarPlaySceneDelegate`. Because
        # this nested/array key can't be expressed via INFOPLIST_KEY_*, it lives here
        # and scene-manifest GENERATION is turned off below so the two don't collide.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        # --- PocketDJ collection document type -------------------------------------
        # Custom UTI so a playlist/pocket export self-identifies as a PocketDJ document:
        # fixes the import-picker grey-out (allowedContentTypes can name this type) AND makes
        # Files/iMessage offer "Open in PocketDJ" (CFBundleDocumentTypes claims it). One type
        # covers both — CollectionsStore.importAny disambiguates by the manifest's `kind`.
        # Array/nested keys, so they MUST live here (INFOPLIST_KEY_* can't inject them).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.pocketdj.collection
            UTTypeDescription: PocketDJ Collection
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - pdjcollection
              public.mime-type:
                - application/x-pocketdj-collection
                - application/zip
        CFBundleDocumentTypes:
          - CFBundleTypeName: PocketDJ Collection
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.pocketdj.collection
        # Opened-from-Files docs arrive as a security-scoped copy we import + discard.
        LSSupportsOpeningDocumentsInPlace: false
    dependencies:
      - package: ZIPFoundation
      # Embed the Now Playing widget extension into the app (all supported platforms).
      - target: PocketDJWidgets
      # The Mix tab's DJ engine is a first-party AVAudioEngine graph (MixEngine.swift) —
      # no third-party audio SDK. (Tempo/pitch/seek/crossfader/effects/beat-match are all
      # AVFoundation nodes; the former Switchboard/Superpowered SDK was removed.)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levi.pocketdj
        PRODUCT_NAME: PocketDJ
        # Any embedded framework lives in DIFFERENT places per platform: the iOS app puts
        # them in `.app/Frameworks` (=@executable_path/Frameworks), the macOS app in
        # `.app/Contents/Frameworks` (=@executable_path/../Frameworks). List BOTH so a
        # multiplatform embedded slice resolves at runtime on each platform.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
        # visionOS is device family 7 (Apple Vision). Per-SDK override so the iOS
        # slice keeps "1,2" and the Vision Pro slice (device + simulator) declares 7 —
        # without it the built app is rejected as incompatible with the visionOS platform.
        "TARGETED_DEVICE_FAMILY[sdk=xros*]": "7"
        "TARGETED_DEVICE_FAMILY[sdk=xrsimulator*]": "7"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: PocketDJ
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # Scene-manifest generation is OFF: we supply an explicit UIApplicationSceneManifest
        # (info.properties above) to declare the CarPlay scene. SwiftUI still provides the
        # window scene (UIApplicationSupportsMultipleScenes: true, no window role declared).
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "NO"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: "PocketDJ"
        # --- Streaming + recognition permissions (Info.plist usage strings) ----
        # Scalar usage descriptions are injectable as INFOPLIST_KEY_* without
        # switching off GENERATE_INFOPLIST_FILE. These are PROMPT strings only;
        # the prompts never fire unless the matching feature is enabled at
        # runtime (ShazamKit mic capture / MusicKit authorization), so shipping
        # them in the default build is harmless.
        #   • Microphone — Studio sample recording + the "?♪?" ShazamKit recognizer.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PocketDJ uses the microphone to record samples and to identify songs that are playing."
        #   • Apple Music — MusicKit catalog search + playback when linked.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "PocketDJ uses Apple Music to play and search tracks from your subscription."
        #   • Speech recognition — the Producer tab's Demuxer transcribes lyrics
        #     ON DEVICE (requiresOnDeviceRecognition; audio never leaves the
        #     device). The prompt fires only when the user runs a transcription.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "PocketDJ transcribes song lyrics on this device so they can be shown in time with the music."
        # --- MusicKit + ShazamKit entitlements ---------------------------------
        # Both app-service entitlements live in one .entitlements file. They are
        # only ENFORCED when signing for a device/distribution (the App ID must
        # have the matching App Services enabled in the Developer portal first —
        # see docs/streaming-integration.md). Simulator builds (CODE_SIGNING_
        # ALLOWED=NO) ignore them, so the default build stays green.
        CODE_SIGN_ENTITLEMENTS: PocketDJ/PocketDJ.entitlements
        # macOS (Mac App Store / TestFlight) REQUIRES the App Sandbox + explicit
        # capability entitlements. Override only for the macOS SDK so iOS keeps the
        # empty file above (iOS's sandbox is implicit).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PocketDJ/PocketDJ-macOS.entitlements
        # CarPlay: `com.apple.developer.carplay-audio` is GRANTED + enabled on the App ID
        # (com.levi.pocketdj) — verified in the Developer portal — so it ships on BOTH iOS
        # SDKs: device/TestFlight (iphoneos) signs green because the capability is in the
        # provisioning profile, and the simulator (iphonesimulator) reads it so the CarPlay
        # Simulator shows the app. It is scoped to the iOS SDKs (not the base file) because
        # the base also covers visionOS, which has no CarPlay and would reject the key.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": PocketDJ/PocketDJ-CarPlay.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": PocketDJ/PocketDJ-CarPlay.entitlements
        # --- Apple Music build-time opt-in -------------------------------------
        # The flag lives in the base Info.plist (info: properties above) as
        # PocketDJAppleMusicEnabled — INFOPLIST_KEY_* can't inject custom keys.

  # --- Now Playing widget extension (iOS + macOS + visionOS) -------------------
  # A WidgetKit extension showing the current track + Up Next, with play/pause/skip
  # buttons (App Intents). It reads the shared App Group snapshot the app writes
  # (Shared/NowPlayingSnapshot.swift) — the widget process can't touch the app's live
  # stores. Deployment targets (iOS 18 / macOS 15 / visionOS 2) already exceed the
  # interactive-widget minimums (iOS 17 / macOS 14).
  PocketDJWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: PocketDJWidgets
      - path: Shared
    info:
      path: PocketDJWidgets/Generated/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levi.pocketdj.widgets
        PRODUCT_NAME: PocketDJWidgets
        # WidgetKit only reached visionOS in visionOS 26, so the extension raises ONLY its
        # visionOS floor to 26 (the app stays at 2.0 — the widget just won't appear on older
        # visionOS). iOS 18 / macOS 15 are inherited and already exceed the interactive-widget
        # minimums (iOS 17 / macOS 14).
        XROS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: PocketDJ
        TARGETED_DEVICE_FAMILY: "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=xros*]": "7"
        "TARGETED_DEVICE_FAMILY[sdk=xrsimulator*]": "7"
        # App Group shared with the app (all SDKs). macOS additionally needs App Sandbox,
        # so it uses a sibling entitlements file that adds the sandbox key.
        CODE_SIGN_ENTITLEMENTS: PocketDJWidgets/PocketDJWidgets.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PocketDJWidgets/PocketDJWidgets-macOS.entitlements

  PocketDJTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/Unit
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: PocketDJ
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levi.pocketdj.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # macOS keeps the executable under Contents/MacOS; XcodeGen's default
        # TEST_HOST is the iOS-shaped path, so override it per-SDK.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/PocketDJ.app/Contents/MacOS/PocketDJ"

  PocketDJUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests/UI
    dependencies:
      - target: PocketDJ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levi.pocketdj.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PocketDJ:
    build:
      targets:
        PocketDJ: all
        PocketDJTests: [test]
        PocketDJUITests: [test]
    test:
      gatherCoverageData: true
      # Host app + unit tests run against the bundled fixture (offline, deterministic).
      environmentVariables:
        - variable: PDJ_USE_FIXTURE
          value: "1"
          isEnabled: true
      targets:
        - PocketDJTests
        - PocketDJUITests

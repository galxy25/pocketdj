<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d10">
<title>__JUKEBOX_NAME__ · PocketDJ Jukebox</title>
<style>
  :root{ --bg:#0a0d10; --card:#12171c; --card2:#161c22; --line:#232b33; --txt:#eef4f5; --dim:#8a97a0; --accent:#1FD6C1; --accent2:#12b5a3; --warn:#ffb454; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--txt); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; }
  body{ padding:18px 16px 40px; max-width:560px; margin:0 auto; }
  a{ color:var(--accent); }
  .head{ display:flex; align-items:center; gap:10px; margin:6px 0 18px; }
  .dot{ width:11px; height:11px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); animation:pulse 2s infinite; flex:none; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  h1{ font-size:20px; margin:0; font-weight:700; letter-spacing:.2px; }
  .sub{ color:var(--dim); font-size:12px; margin-top:2px; text-transform:uppercase; letter-spacing:1.5px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:14px 0; }
  .label{ color:var(--accent); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; }
  .np-title{ font-size:22px; font-weight:700; line-height:1.2; }
  .np-artist{ color:var(--dim); font-size:15px; margin-top:2px; }
  .np-empty{ color:var(--dim); font-style:italic; }
  .bar{ height:6px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:14px; }
  .bar>i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:6px; transition:width .25s linear; }
  .hear{ width:100%; margin-top:14px; background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:11px; padding:11px; font-size:15px; font-weight:700; }
  .hear.on{ background:var(--accent); color:#04201d; }
  .hint{ color:var(--dim); font-size:12px; text-align:center; margin-top:8px; min-height:14px; }
  ul{ list-style:none; margin:0; padding:0; }
  .up li{ display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .up li:last-child{ border-bottom:0; }
  .up .n{ color:var(--accent); font-variant-numeric:tabular-nums; width:20px; flex:none; }
  .up .t{ font-weight:600; } .up .a{ color:var(--dim); }
  .up .grow{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up .time{ color:var(--dim); font-size:12px; flex:none; font-variant-numeric:tabular-nums; }
  .hist{ margin-top:12px; }
  form{ display:flex; flex-direction:column; gap:10px; }
  input{ width:100%; background:var(--card2); border:1px solid var(--line); border-radius:11px; color:var(--txt); padding:13px 14px; font-size:16px; }
  input:focus{ outline:none; border-color:var(--accent); }
  button{ background:var(--accent); color:#04201d; border:0; border-radius:11px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; }
  button:active{ transform:translateY(1px); }
  button:disabled{ opacity:.5; }
  .sent{ color:var(--accent); font-size:14px; min-height:18px; font-weight:600; }
  .req li{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .req li:last-child{ border-bottom:0; }
  .req .t{ font-weight:600; } .req .a{ color:var(--dim); font-size:13px; }
  .req .grow{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip{ flex:none; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; padding:4px 9px; border-radius:999px; }
  .chip.pending{ background:#2a2f16; color:var(--warn); }
  .chip.queued{ background:#06312d; color:var(--accent); }
  .chip.played{ background:#0d2b3a; color:#67c7ff; }
  .chip.denied{ background:#331a1c; color:#ff7b7b; }
  .recon{ color:var(--warn); font-size:12px; text-align:center; margin-top:14px; min-height:16px; opacity:0; transition:opacity .3s; }
  .recon.show{ opacity:1; }
  .ended{ text-align:center; padding:70px 20px; }
  .ended .big{ font-size:52px; } .ended h2{ margin:14px 0 6px; } .ended p{ color:var(--dim); }
  .foot{ text-align:center; color:var(--dim); font-size:11px; margin-top:26px; letter-spacing:.5px; }
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <span class="dot"></span>
    <div><h1 id="jbname">__JUKEBOX_NAME__</h1><div class="sub">Live Jukebox</div></div>
  </div>

  <div class="card">
    <div class="label">Now Playing</div>
    <div id="np"><div class="np-empty">Nothing playing yet…</div></div>
    <div class="bar"><i id="prog"></i></div>
    <button class="hear" id="hearbtn" style="display:none">🔊 Listen in</button>
    <div class="hint" id="hearhint"></div>
    <audio id="au" playsinline></audio>
  </div>

  <div class="card" id="upcard" style="display:none">
    <div class="label">Up Next</div>
    <ul class="up" id="up"></ul>
  </div>

  <div class="card" id="histcard" style="display:none">
    <div class="label">Previously Played</div>
    <button class="hear" id="histbtn" type="button" style="margin-top:0">🕘 Show previously played</button>
    <ul class="up hist" id="hist" style="display:none"></ul>
  </div>

  <div class="card">
    <div class="label">Request a Song</div>
    <form id="reqform" autocomplete="off">
      <input id="title" name="title" placeholder="Song title" maxlength="120" enterkeyhint="send">
      <input id="artist" name="artist" placeholder="Artist (optional)" maxlength="120" enterkeyhint="send">
      <button type="submit" id="submit">Send Request</button>
      <div class="sent" id="sent"></div>
    </form>
  </div>

  <div class="card" id="mycard" style="display:none">
    <div class="label">Your Requests</div>
    <ul class="req" id="myreqs"></ul>
  </div>

  <div class="recon" id="recon">reconnecting…</div>
  <div class="foot">Powered by PocketDJ</div>
</div>

<div id="endedview" style="display:none">
  <div class="ended">
    <div class="big">🎤⬇</div>
    <h2>This jukebox has ended</h2>
    <p>Thanks for playing along.</p>
  </div>
</div>

<script>
(function(){
  var JB = "__JUKEBOX_ID__";
  var API = "__API_BASE__";          // e.g. https://host.ts.net/jukebox
  var STATE_URL = "__STATE_URL__";   // CloudFront jukebox/<id>/state.json
  var CK = "pdj_jb_client";
  var MK = "pdj_jb_mine_" + JB;

  var clientId = localStorage.getItem(CK);
  if(!clientId){ clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)+Date.now()); localStorage.setItem(CK, clientId); }
  var mine = [];
  try{ mine = JSON.parse(localStorage.getItem(MK)) || []; }catch(e){ mine = []; }
  function saveMine(){ try{ localStorage.setItem(MK, JSON.stringify(mine.slice(-20))); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var lastState = null, fails = 0, ended = false;
  var progBase = 0, progLen = 0, progAt = 0; // now-playing interpolation
  var listening = false, curStream = null;   // View + Hear (the live radio)
  var au = null;
  var pagePause = false;                     // our own pause() — the 'pause' listener must ignore it
  var histOpen = false;                      // Previously Played reveal

  function esc(s){ var d=document.createElement("div"); d.textContent=(s==null?"":String(s)); return d.innerHTML; }

  function render(st){
    // Now playing
    var np = st.nowPlaying;
    if(np && np.title){
      $("np").innerHTML = '<div class="np-title">'+esc(np.title)+'</div>'+(np.artist?'<div class="np-artist">'+esc(np.artist)+'</div>':'');
      progLen = Number(np.lengthMs)||0; progBase = Number(np.positionMs)||0; progAt = Date.now();
    } else {
      $("np").innerHTML = '<div class="np-empty">Nothing playing yet…</div>';
      progLen = 0; progBase = 0;
    }
    // Up next
    var up = Array.isArray(st.upNext) ? st.upNext : [];
    if(up.length){
      $("upcard").style.display = "";
      $("up").innerHTML = up.slice(0,12).map(function(x,i){
        return '<li><span class="n">'+(i+1)+'</span><span><span class="t">'+esc(x.title)+'</span>'+(x.artist?' <span class="a">— '+esc(x.artist)+'</span>':'')+'</span></li>';
      }).join("");
    } else { $("upcard").style.display = "none"; }
    // Previously played — the button reveals the list (newest first, with local end times)
    var played = Array.isArray(st.played) ? st.played : [];
    if(played.length){
      $("histcard").style.display = "";
      $("histbtn").textContent = "🕘 " + (histOpen ? "Hide" : "Show") + " previously played (" + played.length + ")";
      $("histbtn").classList.toggle("on", histOpen);
      $("hist").style.display = histOpen ? "" : "none";
      if(histOpen){
        $("hist").innerHTML = played.slice().reverse().map(function(x,i){
          var t = x.endedAt ? new Date(x.endedAt).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : "";
          return '<li><span class="n">'+(i+1)+'</span><span class="grow"><span class="t">'+esc(x.title)+'</span>'+
                 (x.artist?' <span class="a">— '+esc(x.artist)+'</span>':'')+'</span>'+
                 (t?'<span class="time">'+esc(t)+'</span>':'')+'</li>';
        }).join("");
      }
    } else { $("histcard").style.display = "none"; }
    handleHear(st);
    // My requests — match my submitted ids against the shared status feed
    var byId = {}; (st.requests||[]).forEach(function(r){ byId[r.id]=r; });
    if(mine.length){
      $("mycard").style.display = "";
      $("myreqs").innerHTML = mine.slice().reverse().map(function(m){
        var srv = byId[m.id]; var status = srv ? srv.status : "pending";
        return '<li><span class="grow"><span class="t">'+esc(m.title)+'</span>'+(m.artist?' <span class="a">— '+esc(m.artist)+'</span>':'')+
               '</span><span class="chip '+esc(status)+'">'+esc(status)+'</span></li>';
      }).join("");
    }
    tickProgress();
  }

  function tickProgress(){
    if(progLen>0){
      var el = progBase + (Date.now()-progAt);
      var pct = Math.max(0, Math.min(100, (el/progLen)*100));
      $("prog").style.width = pct + "%";
    } else { $("prog").style.width = "0%"; }
  }
  setInterval(tickProgress, 250);

  // View + Hear — the LIVE RADIO: play the current track's public rip in sync with the DJ,
  // straight from the rips bucket, no app needed. The FIRST play must be inside the tap
  // gesture (mobile autoplay); after that, src swaps on track change keep the station going.
  // Position-sync = positionMs + (now - updatedAt), re-seek only on >3s drift. Each poll also
  // self-heals: an unexpectedly paused element (stall, network hiccup, background throttle)
  // gets a play() retry, so tuning in behaves like a station, not a one-shot preview.
  function handleHear(st){
    if(!au) au = $("au");
    var np = st.nowPlaying || {};
    var stream = (st.hear && np.streamUrl) ? np.streamUrl : null;
    var btn = $("hearbtn");
    if(stream){
      btn.style.display = "";
      $("hearhint").textContent = listening ? (au.error ? "stream hiccup — retrying…" : "") : "listen along in your browser, synced with the DJ";
      if(curStream !== stream){                 // new track (or came back streamable)
        curStream = stream;
        if(listening){ try{ au.src = curStream; au.play().catch(function(){}); }catch(e){} }
      }
      if(listening){
        // Never seek/restart past the file's end: at a track boundary the guest's file
        // finishes BEFORE the next track lands in state.json (host tick + 1s debounce +
        // poll ≈ a few seconds of stale state). An ended element must stay silent until
        // the src swap — play() on it would rewind to 0 and replay the intro.
        var dur = isFinite(au.duration) && au.duration > 0 ? au.duration : Infinity;
        var target = ((Number(np.positionMs)||0) + (Date.now() - (Number(st.updatedAt)||Date.now())))/1000;
        if(target >= 0 && target < dur - 0.5 && isFinite(au.currentTime) && Math.abs(au.currentTime - target) > 3){ try{ au.currentTime = target; }catch(e){} }
        if(au.paused && !au.ended){ try{ au.play().catch(function(){}); }catch(e){} }
        btn.textContent = "📻 On air — tap to stop"; btn.classList.add("on");
      } else { btn.textContent = "📻 Tune in — live radio"; btn.classList.remove("on"); }
    } else {
      btn.style.display = "none";
      curStream = null;
      if(listening){
        // Flag only when a 'pause' event will actually fire (pause() on an already-
        // paused element fires none — a stale flag would swallow a real system pause).
        if(!au.paused){ pagePause = true; try{ au.pause(); }catch(e){} }
        $("hearhint").textContent = "this track isn't streamable — radio resumes on the next one";
      }
    }
    updateMediaSession(st, np, stream);
  }
  function setListening(on){
    if(!au) au = $("au");
    listening = on;
    if(on){ if(curStream){ try{ au.src = curStream; au.play().catch(function(){}); }catch(e){} } }
    else { try{ au.pause(); }catch(e){} }
    if(lastState) render(lastState);
  }
  document.getElementById("hearbtn").addEventListener("click", function(){ setListening(!listening); });
  // Lock-screen/notification card: while tuned in, the radio announces itself like a
  // station (Media Session), and the system play/pause buttons tune in/out. "playing"
  // only while a stream is actually live — the not-streamable gap reads "paused".
  function updateMediaSession(st, np, stream){
    if(!("mediaSession" in navigator)) return;
    try{
      if(listening && np && np.title){
        navigator.mediaSession.metadata = new MediaMetadata({
          title: np.title, artist: np.artist || "",
          album: (st && st.name ? st.name : "PocketDJ Jukebox") + " — live"
        });
      }
      navigator.mediaSession.playbackState = (listening && stream) ? "playing" : "paused";
    }catch(e){}
  }
  if("mediaSession" in navigator){
    try{
      navigator.mediaSession.setActionHandler("play", function(){ if(!ended) setListening(true); });
      navigator.mediaSession.setActionHandler("pause", function(){ setListening(false); });
    }catch(e){}
  }
  // Joining mid-song: the drift-sync target can't seek until the file's metadata is in.
  $("au").addEventListener("loadedmetadata", function(){ if(listening && lastState) handleHear(lastState); });
  // play() can't revive an ERRORED element — reload the source (src reassign) and let the
  // poll's drift-sync re-seek to the live position; repeated failures re-fire 'error' and
  // retry on a 2s cadence. The hint stays up via handleHear while au.error persists.
  $("au").addEventListener("error", function(){
    if(!listening) return;
    $("hearhint").textContent = "stream hiccup — retrying…";
    setTimeout(function(){
      if(listening && curStream && au.error){ try{ au.src = curStream; au.play().catch(function(){}); }catch(e){} }
    }, 2000);
  });
  // A pause the page didn't ask for (headphone unplug, an interruption ending, lock-screen
  // pause on browsers without Media Session routing): RESPECT it — flip the radio off
  // instead of fighting the OS every poll. Natural track end also fires 'pause' (just
  // before 'ended') — that's the boundary gap, not intent; the next src swap resumes.
  $("au").addEventListener("pause", function(){
    if(pagePause){ pagePause = false; return; }
    if(au.error) return; // a fatal media error pauses too — that's the 'error' handler's territory, not intent
    if(au.ended || (isFinite(au.duration) && au.duration > 0 && au.currentTime >= au.duration - 0.5)) return;
    if(listening){ listening = false; if(lastState) render(lastState); }
  });
  $("histbtn").addEventListener("click", function(){ histOpen = !histOpen; if(lastState) render(lastState); });

  // The ended screen must also take the radio off the air: stop the audio (the final
  // state.json still carries a live streamUrl), silence the lock-screen card, and the
  // gated Media Session play handler can't resurrect the stream behind the ended view.
  function showEnded(){
    ended = true;
    listening = false;
    if(!au) au = $("au");
    try{ au.pause(); }catch(e){}
    if("mediaSession" in navigator){
      try{ navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = "none"; }catch(e){}
    }
    $("app").style.display = "none";
    $("endedview").style.display = "";
  }

  function poll(){
    if(ended) return;
    fetch(STATE_URL + "?t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(st){
        fails = 0; $("recon").classList.remove("show");
        lastState = st;
        if(st.name){ $("jbname").textContent = st.name; }
        if(st.ended){ showEnded(); return; }
        render(st);
      })
      .catch(function(){
        fails++;
        if(fails>=3){ $("recon").classList.add("show"); } // keep last state, hint quietly
      });
  }
  setInterval(poll, 4000);
  poll();

  // Request submit (Enter in either field submits the form)
  $("reqform").addEventListener("submit", function(e){
    e.preventDefault();
    var title = $("title").value.trim();
    var artist = $("artist").value.trim();
    if(!title){ $("title").focus(); return; }
    $("submit").disabled = true;
    fetch(API + "/jukebox/" + JB + "/request", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ title:title, artist:artist, clientId:clientId })
    })
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, j:j }; }); })
    .then(function(res){
      $("submit").disabled = false;
      if(res.ok && res.j.requestId){
        mine.push({ id:res.j.requestId, title:title, artist:artist }); saveMine();
        $("sent").textContent = "request sent ✓";
        $("title").value = ""; $("artist").value = "";
        if(lastState) render(lastState);
        setTimeout(function(){ $("sent").textContent=""; }, 3000);
      } else {
        $("sent").style.color = "var(--warn)";
        $("sent").textContent = (res.j && res.j.error) ? res.j.error : "couldn't send — try again";
        setTimeout(function(){ $("sent").style.color=""; $("sent").textContent=""; }, 3500);
      }
    })
    .catch(function(){
      $("submit").disabled = false;
      $("sent").style.color = "var(--warn)";
      $("sent").textContent = "network error — try again";
      setTimeout(function(){ $("sent").style.color=""; $("sent").textContent=""; }, 3500);
    });
  });
})();
</script>
</body>
</html>

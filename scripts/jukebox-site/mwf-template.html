<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d10">
<title>__MWF_NAME__ · PocketDJ Music with Friends</title>
<style>
  :root{ --bg:#0a0d10; --card:#12171c; --card2:#161c22; --line:#232b33; --txt:#eef4f5; --dim:#8a97a0; --accent:#1FD6C1; --accent2:#ffce6e; --warn:#ffb454; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--txt); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; }
  body{ padding:18px 16px 40px; max-width:560px; margin:0 auto; }
  .head{ display:flex; align-items:center; gap:10px; margin:6px 0 18px; }
  .dot{ width:11px; height:11px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); animation:pulse 2s infinite; flex:none; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  h1{ font-size:20px; margin:0; font-weight:700; letter-spacing:.2px; }
  .sub{ color:var(--dim); font-size:12px; margin-top:2px; text-transform:uppercase; letter-spacing:1.5px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:14px 0; }
  .label{ color:var(--accent); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; }
  .theme{ font-size:18px; font-weight:700; line-height:1.3; }
  .turn{ color:var(--accent2); font-size:13px; margin-top:8px; min-height:16px; }
  .openapp{ display:block; width:100%; margin-top:14px; background:var(--accent); color:#04201d; border:0; border-radius:11px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; text-align:center; text-decoration:none; }
  .openapp:active{ transform:translateY(1px); }
  .apphint{ color:var(--dim); font-size:12px; text-align:center; margin-top:8px; }
  ul{ list-style:none; margin:0; padding:0; }
  li{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  li:last-child{ border-bottom:0; }
  .n{ color:var(--accent); font-variant-numeric:tabular-nums; width:22px; flex:none; }
  .t{ font-weight:600; } .a{ color:var(--dim); }
  .grow{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score{ color:var(--accent2); font-weight:700; font-variant-numeric:tabular-nums; flex:none; }
  .crown{ flex:none; }
  .empty{ color:var(--dim); font-style:italic; }
  .ended{ text-align:center; padding:70px 20px; }
  .ended .big{ font-size:52px; } .ended h2{ margin:14px 0 6px; } .ended p{ color:var(--dim); }
  .foot{ text-align:center; color:var(--dim); font-size:11px; margin-top:26px; letter-spacing:.5px; }
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <span class="dot"></span>
    <div><h1 id="mwfname">__MWF_NAME__</h1><div class="sub">Music with Friends</div></div>
  </div>

  <div class="card">
    <div class="label">Theme</div>
    <div class="theme" id="theme">__MWF_THEME__</div>
    <div class="turn" id="turn"></div>
    <!-- View-only v1: suggesting/joining happens in the app. The page URL itself is the
         universal link; the button is the pocketdj:// fallback. -->
    <a class="openapp" href="pocketdj://mwf/__MWF_ID__">Open in PocketDJ</a>
    <div class="apphint">Join, suggest songs, and score points in the app</div>
  </div>

  <div class="card">
    <div class="label">Leaderboard</div>
    <ul id="members"><li class="empty">Loading…</li></ul>
  </div>

  <div class="card">
    <div class="label">Accepted songs</div>
    <ul id="collection"><li class="empty">Nothing accepted yet</li></ul>
  </div>

  <div class="foot">PocketDJ · Music with Friends</div>
</div>
<script>
(() => {
  const STATE_URL = "__STATE_URL__";
  const esc = (s) => String(s == null ? '' : s);
  const $ = (id) => document.getElementById(id);

  function render(st) {
    if (!st) return;
    if (st.name) $('mwfname').textContent = st.name;
    if (st.theme) $('theme').textContent = st.theme;
    if (st.ended) {
      document.getElementById('app').innerHTML =
        '<div class="ended"><div class="big">🎬</div><h2>Session over</h2>' +
        '<p>Thanks for playing ' + esc(st.name) + '.</p></div>';
      clearInterval(timer);
      return;
    }
    // Turn banner (client-interpolated countdown off the server deadline).
    const turnEl = $('turn');
    if (st.turn && st.members) {
      const m = st.members.find((x) => x.memberId === st.turn.memberId);
      const left = Math.max(0, Math.round(((st.turn.deadline || 0) - Date.now()) / 1000));
      turnEl.textContent = (m ? m.name : 'Someone') + "'s turn · " +
        Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + ' left';
    } else {
      turnEl.textContent = '';
    }
    // Leaderboard sorted score-desc; crown on the leader.
    const members = (st.members || []).slice().sort((a, b) => (b.score || 0) - (a.score || 0));
    $('members').innerHTML = members.length
      ? members.map((m, i) =>
          '<li><span class="n">' + (i + 1) + '</span>' +
          '<span class="grow t">' + esc(m.name) + (m.isLeader ? ' <span class="crown">👑</span>' : '') + '</span>' +
          '<span class="score">' + (m.score || 0) + '</span></li>').join('')
      : '<li class="empty">No members yet</li>';
    // Accepted songs, accept order.
    const coll = st.collection || [];
    $('collection').innerHTML = coll.length
      ? coll.map((c, i) =>
          '<li><span class="n">' + (i + 1) + '</span>' +
          '<div class="grow"><span class="t">' + esc(c.title) + '</span>' +
          ' <span class="a">' + esc(c.artist) + '</span></div></li>').join('')
      : '<li class="empty">Nothing accepted yet</li>';
  }

  async function poll() {
    try {
      const r = await fetch(STATE_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) render(await r.json());
    } catch { /* transient — keep polling */ }
  }
  const timer = setInterval(poll, 4000);
  poll();
})();
</script>
</body>
</html>
